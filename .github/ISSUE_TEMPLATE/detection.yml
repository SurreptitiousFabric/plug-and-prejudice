name: Detection-rule proposal
description: Propose a deterministic, evidence-backed analysis improvement.
title: "analysis: "
body:
  - type: markdown
    attributes:
      value: |
        Start with the [deterministic analysis rule catalogue](https://github.com/SurreptitiousFabric/plug-and-prejudice/blob/main/docs/analysis-rules.md). Proposals must distinguish observable facts, supported inference, and unknown behavior; keyword-only warnings are not accepted. Link every ADR, rule section, implementation area, test, issue, or pull request you name so a reader never has to search for it.
  - type: textarea
    id: observable
    attributes:
      label: Parsed observable
      description: What syntax or structured operation can establish the behavior without executing target code?
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: Context and potential consequence
      description: Explain when the behavior matters, the proposed claim type, and why severity reflects impact rather than a command name.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence model
      description: Describe the file/line/operation evidence and relationships a user should be able to inspect.
    validations:
      required: true
  - type: textarea
    id: benign
    attributes:
      label: Benign and ambiguous cases
      description: Give legitimate examples, lookalikes, dynamic forms, and malformed inputs that must not become confident findings.
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Unknowns and analysis limits
      description: State what cannot be safely resolved and when the report should become incomplete.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Direct links
      description: Link every ADR, rule section, implementation area, test, issue, or pull request you name. Use commit permalinks when the exact revision matters.
      placeholder: |
        - Rule and decision records: https://github.com/...
        - Implementation and tests: https://github.com/...
        - Related issues or pull requests: https://github.com/...
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Trust-boundary check
      options:
        - label: The proposal does not require sourcing, importing, evaluating, or executing target-plugin code.
          required: true
        - label: I have not included secrets, private plugin source, personal configuration, or live malware.
          required: true
