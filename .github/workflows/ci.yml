name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      require_live_containment:
        description: Fail if any designated live containment test skips
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  GOFLAGS: -tags=grammar_subset,grammar_subset_python,grammar_subset_javascript

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Bubblewrap for namespace integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap

      - name: Verify module checksums
        run: go mod verify

      - name: Verify CI least-privilege policy
        run: scripts/verify-ci-policy.sh

      - name: Verify production dependency boundary and notices
        run: scripts/verify-production-dependencies.sh

      - name: Verify selective parser binary footprint
        run: scripts/verify-parser-footprint.sh

      - name: Compare trusted parser samples with language syntax oracles
        run: scripts/verify-parser-oracles.sh

      - name: Test
        run: go test ./...

      - name: Record live containment run and skip evidence
        shell: bash
        env:
          REQUIRE_LIVE_CONTAINMENT: ${{ inputs.require_live_containment && '1' || '0' }}
        run: |
          set -o pipefail
          mkdir -p containment-evidence
          set +e
          go test -json -count=1 \
            ./cmd/plug-prejudice-broker ./internal/resource ./internal/sandbox \
            | tee containment-evidence/go-test-live.json
          test_status=${PIPESTATUS[0]}
          scripts/summarize-live-containment-tests.py \
            containment-evidence/go-test-live.json \
            containment-evidence/summary.json \
            containment-evidence/summary.md
          summary_status=$?
          set -e
          cat containment-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
          if (( test_status != 0 || summary_status != 0 )); then
            exit 1
          fi

      - name: Upload live containment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-containment-${{ matrix.arch }}
          path: containment-evidence/
          if-no-files-found: error

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check known reachable vulnerabilities
        run: scripts/verify-vulnerabilities.sh

      - name: Verify native static reproducible builds
        run: scripts/verify-reproducible-build.sh

      - name: Verify Arch package template and release inputs
        run: scripts/verify-arch-package-template.sh

      - name: Verify release SBOM tool pin
        run: scripts/verify-release-tool-pin.sh

      - name: Exercise release metadata assembly
        if: matrix.arch == 'amd64'
        run: scripts/verify-release-metadata.sh
